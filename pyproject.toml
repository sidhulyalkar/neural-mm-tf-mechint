[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "neural-mechint-lab"
version = "0.2.0"
description = "A research-grade learning laboratory for causal mechanistic interpretability"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26",
  "torch>=2.2",
  "scikit-learn>=1.4",
  "PyYAML>=6.0",
  "typer>=0.12",
  "rich>=13.7",
]

[project.optional-dependencies]
frontier = [
  "transformers>=4.50",
  "accelerate>=1.2",
  "safetensors>=0.5",
]
research = [
  "pandas>=2.2",
  "matplotlib>=3.8",
  "plotly>=5.24",
  "streamlit>=1.41",
]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.8",
]

[project.scripts]
mechint = "neural_mechint.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "B008"]
