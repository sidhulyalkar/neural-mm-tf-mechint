[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "neural-mm-tf-mechint"
version = "0.2.0"
description = "Multimodal neural modeling: reproducible PyTorch pipelines, temporal fusion, and model inspection"
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "Sidharth Hulyalkar"}]
dependencies = ["torch>=2.2,<3", "numpy>=1.24,<3", "PyYAML>=6,<7"]

[project.optional-dependencies]
dashboard = ["streamlit>=1.32,<2", "matplotlib>=3.7,<4", "pandas>=2,<3"]
concepts = ["scikit-learn>=1.3,<2"]
dev = ["pytest>=8,<10", "ruff>=0.6,<1", "build>=1,<2"]

[project.urls]
Repository = "https://github.com/sidhulyalkar/neural-mm-tf-mechint"
Portfolio = "https://sidhulyalkar.com"

[project.scripts]
multimodal-train = "train:main"

[tool.setuptools]
py-modules = ["model", "fusion", "data_simulation", "dataloaders", "configuration", "baselines", "train", "dashboard"]

[tool.setuptools.packages.find]
include = ["encoders*", "interpretability*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
